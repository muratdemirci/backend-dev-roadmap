              // 3) Mermaid

              if (mels.length > 0) {
                mels.forEach(function (el) { el.removeAttribute("data-processed"); });
                mermaid.run({ nodes: mels });

              // 4) Sync mobile menu from docsify sidebar
              if (typeof window._mmSync === 'function') {
                window._mmSync();

    <script>
    /* ═══════════════════════════════════════════════════
       MOBILE MENU — clones docsify sidebar for sync
       ═══════════════════════════════════════════════════ */
    (function () {
      // Create DOM
      var fab = document.createElement('div');
      fab.id = 'mmFab';
      fab.innerHTML = '&#9776;';
      document.body.appendChild(fab);

      var ov = document.createElement('div');
      ov.id = 'mmOverlay';
      document.body.appendChild(ov);

      var pn = document.createElement('div');
      pn.id = 'mmPanel';
      pn.innerHTML = '<div class="mm-hdr">Backend Developer Roadmap</div><div class="mm-body"></div>';
      document.body.appendChild(pn);

      var mmBody = pn.querySelector('.mm-body');

      // Open / Close
      function openMenu() {
        pn.classList.add('open');
        ov.classList.add('open');
        fab.classList.add('open');
        fab.innerHTML = '&#10005;';
        document.body.style.overflow = 'hidden';
      }
      function closeMenu() {
        pn.classList.remove('open');
        ov.classList.remove('open');
        fab.classList.remove('open');
        fab.innerHTML = '&#9776;';
        document.body.style.overflow = '';
      }

      fab.addEventListener('click', function () {
        pn.classList.contains('open') ? closeMenu() : openMenu();
      });
      ov.addEventListener('click', closeMenu);

      // Close on link click inside mobile panel
      pn.addEventListener('click', function (e) {
        if (e.target.closest('a[href]') && !e.target.closest('a[href="#/"]')) {
          var href = e.target.closest('a[href]').getAttribute('href');
          if (href && href !== 'javascript:void(0)') {
            closeMenu();
          }
        }
      });

      // Sync: clone docsify sidebar content into mobile panel
      window._mmSync = function () {
        var sidebarNav = document.querySelector('.sidebar-nav');
        if (!sidebarNav) return;

        // Deep clone
        var clone = sidebarNav.cloneNode(true);

        // Remove any docsify-specific toggle buttons if present
        clone.querySelectorAll('.sidebar-toggle, button').forEach(function (el) {
          el.remove();
        });

        // Replace mobile body content
        mmBody.innerHTML = '';
        mmBody.appendChild(clone);

        // Make all links close the menu on click
        clone.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () {
            closeMenu();
          });
        });
      };

      // Initial sync attempt (docsify may not have rendered yet)
      setTimeout(function () {
        if (typeof window._mmSync === 'function') {
          window._mmSync();
        }
      }, 500);
    })();
    </script>
