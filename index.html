        <h1>Backend Developer Roadmap</h1>
        <p>A comprehensive, step-by-step guide to becoming a modern backend developer.</p>
        <h2>Topics Covered</h2>
        <ul>
          <li><strong>Internet Fundamentals</strong> — How the internet works, HTTP, DNS, browsers, domain names, hosting</li>
          <li><strong>Frontend Basics</strong> — HTML, CSS, JavaScript essentials for backend developers</li>
          <li><strong>OS and General Knowledge</strong> — Processes, memory management, file systems, networking</li>
          <li><strong>Programming Languages</strong> — JavaScript/Node.js, Python, Java, Go, Rust, C#, PHP, Ruby</li>
          <li><strong>Version Control</strong> — Git fundamentals, branching strategies, GitHub/GitLab</li>
          <li><strong>Databases</strong> — Relational (PostgreSQL, MySQL), NoSQL (MongoDB, Redis), N+1 problem</li>
          <li><strong>APIs</strong> — REST, GraphQL, gRPC, authentication, API design best practices</li>
          <li><strong>Caching</strong> — Redis, Memcached, CDN, cache strategies and eviction policies</li>
          <li><strong>Web Security</strong> — OWASP Top 10, HTTPS/TLS, SQL injection, XSS, CSRF, OAuth 2.0</li>
          <li><strong>Testing</strong> — Unit, integration, E2E testing, TDD, code coverage</li>
          <li><strong>CI/CD</strong> — GitHub Actions, Jenkins, deployment strategies, infrastructure as code</li>
          <li><strong>Design Principles</strong> — SOLID, DRY, KISS, design patterns, clean code</li>
          <li><strong>Architectural Patterns</strong> — Monolith, microservices, serverless, CQRS, service mesh, twelve-factor app</li>
          <li><strong>Search Engines</strong> — Elasticsearch, Solr, MeiliSearch</li>
          <li><strong>Message Brokers</strong> — RabbitMQ, Apache Kafka, Redis Pub/Sub</li>
          <li><strong>Containerization</strong> — Docker, Kubernetes, container orchestration</li>
          <li><strong>GraphQL</strong> — Schema, queries, mutations, subscriptions, DataLoader</li>
          <li><strong>Graph Databases</strong> — Neo4j, Cypher query language, use cases</li>
          <li><strong>Real-time Communication</strong> — WebSockets, Server-Sent Events</li>
          <li><strong>Web Servers</strong> — Nginx, Apache, Caddy, reverse proxy, load balancing</li>
          <li><strong>Scaling</strong> — Horizontal/vertical scaling, sharding, replication, circuit breaker, monitoring, telemetry</li>
        </ul>
        <p>Please enable JavaScript to use the interactive version of this roadmap.</p>
        <p>Source: <a href="https://github.com/muratdemirci/backend-dev-roadmap">github.com/muratdemirci/backend-dev-roadmap</a></p>

    <script>
      mermaid.initialize({ startOnLoad: false, theme: "default" });

      window.$docsify = {
        el: "#app",

        name: '<span style="font-size: 17px; background: inherit;">Backend Developer Roadmap ' + new Date().getFullYear() + ' </span>',

        subMaxLevel: 3,
        auto2top: true,
        // Dynamic page title for SEO
        nameLink: '/',
        themeColor: '#42b983',
        plugins: [
          function (hook) {
            // Update page title dynamically
            hook.doneEach(function () {
              var title = document.querySelector('.markdown-section h1');
              if (title) {
                document.title = title.textContent + ' — Backend Developer Roadmap';
              } else {
                document.title = 'Backend Developer Roadmap ' + new Date().getFullYear();
              }

              // Mermaid rendering
              var els = document.querySelectorAll(".mermaid");
              if (els.length > 0) {
                els.forEach(function (el) {
                  el.removeAttribute("data-processed");
                });
                mermaid.run({ nodes: els });
              }
            });

            // Update canonical URL on page change
            hook.doneEach(function () {
              var canonical = document.querySelector('link[rel="canonical"]');
              if (canonical) {
                canonical.href = 'https://muratdemirci.github.io/backend-dev-roadmap/' + window.location.hash;
              }
            });
          },
        ],
        markdown: {
          renderer: {
            code: function (code, lang) {
              if (lang === "mermaid") {
                return '<div class="mermaid">' + code + "</div>";
              }
              return this.origin.code.apply(this, arguments);
            },
          },
        },
      };
    </script>

      function buildMenu() {
        var html = '';
        menu.forEach(function(item) {
          if (item.children) {
            html += '<li class="mm-p"><a href="javascript:void(0)">' + item.t + ' <span class="arr">&#9654;</span></a><ul class="mm-sub">';
            if (item.h) {
              html += '<li><a href="' + item.h + '">Overview</a></li>';
            }
            item.children.forEach(function(c) {
              html += '<li><a href="' + c.h + '">' + c.t + '</a></li>';
            });
            html += '</ul></li>';
          } else {
            html += '<li><a href="' + item.h + '">' + item.t + '</a></li>';
          }
        });
        return html;
      }

      var fab = document.createElement('div');
      fab.id = 'mmFab';
      fab.innerHTML = '&#9776;';
      document.body.appendChild(fab);

      var ov = document.createElement('div');
      ov.id = 'mmOverlay';
      document.body.appendChild(ov);

      var pn = document.createElement('div');
      pn.id = 'mmPanel';
      pn.innerHTML = '<div class="mm-hdr">Backend Developer Roadmap</div><ul class="mm-list">' + buildMenu() + '</ul>';
      document.body.appendChild(pn);

      function openMenu() {
        pn.classList.add('open');
        ov.classList.add('open');
        fab.classList.add('open');
        fab.innerHTML = '&#10005;';
        document.body.style.overflow = 'hidden';
      }
      function closeMenu() {
        pn.classList.remove('open');
        ov.classList.remove('open');
        fab.classList.remove('open');
        fab.innerHTML = '&#9776;';
        document.body.style.overflow = '';
      }

      fab.addEventListener('click', function() {
        pn.classList.contains('open') ? closeMenu() : openMenu();
      });
      ov.addEventListener('click', closeMenu);

      pn.addEventListener('click', function(e) {
        var a = e.target.closest('li.mm-p > a');
        if (a) {
          e.preventDefault();
          a.parentElement.classList.toggle('exp');
          return;
        }
        var link = e.target.closest('.mm-sub a, .mm-list > li:not(.mm-p) > a');
        if (link) {
          closeMenu();
        }
      });
    })();
